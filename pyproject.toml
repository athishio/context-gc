[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-gc"
version = "0.1.0"
description = "Deterministic, receipt-preserving context compaction middleware for LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Athish M"},
    {name = "Bavithiran V"},
    {name = "Kamalesh T"},
    {name = "Rohinth K V"}
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0"
]

[tool.setuptools]
packages = ["context_gc"]
